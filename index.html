<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#ffe4ec">
<title>עבור דיאנה 🌸</title>
<style>
  :root { color-scheme: light only; }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { background: #fff0f5; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(160deg, #fff5f8 0%, #ffe4ec 45%, #ffd1dc 100%);
    font-family: "Segoe UI", "Rubik", "Assistant", Arial, sans-serif;
    overflow: hidden;
    color: #6b3a4b;
  }

  .stage {
    position: relative;
    width: 100%;
    max-width: 480px;
    padding: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }

  /* ---------- Bubble ---------- */
  .bubble-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: opacity .8s ease, transform .8s ease;
  }
  .bubble-wrap.hide {
    opacity: 0;
    transform: scale(.6) translateY(-40px);
    pointer-events: none;
  }

  .bubble {
    width: 300px;
    height: 300px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 25%, #ffffff 0 9%, rgba(255,255,255,.75) 24%, rgba(255,228,236,.7) 60%, rgba(255,193,210,.8) 100%);
    box-shadow: inset -10px -14px 30px rgba(255,150,180,.3), inset 8px 10px 25px rgba(255,255,255,.9), 0 18px 40px rgba(240,140,170,.3);
    border: 3px solid #fff;
    position: relative;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    animation: float 4s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-14px); }
  }

  /* ---------- Panda ---------- */
  .panda {
    position: relative;
    width: 200px;
    height: 220px;
    margin-bottom: 14px;
  }

  .head {
    position: absolute;
    top: 6px; left: 50%;
    width: 150px; height: 126px;
    transform: translateX(-50%);
    background: #fff;
    border-radius: 50% 50% 45% 45% / 55% 55% 45% 45%;
    box-shadow: 0 5px 12px rgba(0,0,0,.08);
    z-index: 4;
    animation: tilt 5s ease-in-out infinite;
  }
  @keyframes tilt {
    0%, 100% { transform: translateX(-50%) rotate(0deg); }
    30% { transform: translateX(-50%) rotate(-5deg); }
    60% { transform: translateX(-50%) rotate(4deg); }
  }

  .ear {
    position: absolute;
    top: -10px;
    width: 46px; height: 46px;
    background: #222;
    border-radius: 50%;
    z-index: -1;
  }
  .ear::after {
    content: "";
    position: absolute;
    top: 11px; left: 11px;
    width: 24px; height: 24px;
    background: #ff9fb8;
    border-radius: 50%;
  }
  .ear.l { left: 0; }
  .ear.r { right: 0; }

  .bow {
    position: absolute;
    top: -14px; left: 50%;
    transform: translateX(-50%);
    width: 50px; height: 24px;
    z-index: 5;
  }
  .bow::before, .bow::after {
    content: "";
    position: absolute;
    top: 0;
    width: 22px; height: 22px;
    background: #ff6b9a;
    border-radius: 50% 10% 50% 10%;
  }
  .bow::before { left: 0; transform: rotate(-15deg); }
  .bow::after { right: 0; transform: rotate(15deg) scaleX(-1); }
  .bow span {
    position: absolute;
    top: 5px; left: 50%;
    transform: translateX(-50%);
    width: 12px; height: 12px;
    background: #ff4d85;
    border-radius: 50%;
    z-index: 1;
  }

  .patch {
    position: absolute;
    top: 42px;
    width: 38px; height: 48px;
    background: #222;
    border-radius: 55% 45% 50% 50% / 60% 60% 40% 40%;
  }
  .patch.l { left: 28px; transform: rotate(28deg); }
  .patch.r { right: 28px; transform: rotate(-28deg); }

  .eye {
    position: absolute;
    top: 13px; left: 10px;
    width: 17px; height: 19px;
    background: #fff;
    border-radius: 50%;
    animation: blink 4.5s infinite;
  }
  .eye::before {
    content: "";
    position: absolute;
    top: 4px; left: 3px;
    width: 11px; height: 12px;
    background: #222;
    border-radius: 50%;
  }
  .eye::after {
    content: "";
    position: absolute;
    top: 5px; left: 5px;
    width: 4px; height: 4px;
    background: #fff;
    border-radius: 50%;
  }
  @keyframes blink {
    0%, 92%, 100% { transform: scaleY(1); }
    95% { transform: scaleY(.1); }
  }

  .nose {
    position: absolute;
    top: 80px; left: 50%;
    width: 18px; height: 12px;
    transform: translateX(-50%);
    background: #222;
    border-radius: 50% 50% 60% 60% / 40% 40% 60% 60%;
  }
  .mouth {
    position: absolute;
    top: 89px; left: 50%;
    width: 28px; height: 10px;
    transform: translateX(-50%);
  }
  .mouth::before, .mouth::after {
    content: "";
    position: absolute;
    top: 0;
    width: 14px; height: 9px;
    border-bottom: 3px solid #222;
    border-radius: 0 0 50% 50%;
  }
  .mouth::before { left: 0; }
  .mouth::after { right: 0; }
  .tongue {
    position: absolute;
    top: 96px; left: 50%;
    transform: translateX(-50%);
    width: 10px; height: 8px;
    background: #ff7fa3;
    border-radius: 0 0 50% 50%;
  }

  .cheek {
    position: absolute;
    top: 82px;
    width: 22px; height: 13px;
    background: #ffb3c6;
    border-radius: 50%;
  }
  .cheek.l { left: 14px; }
  .cheek.r { right: 14px; }

  .body {
    position: absolute;
    top: 104px; left: 50%;
    width: 136px; height: 112px;
    transform: translateX(-50%);
    background: #fff;
    border-radius: 50% 50% 45% 45% / 45% 45% 55% 55%;
    z-index: 2;
    overflow: hidden;
    box-shadow: 0 5px 12px rgba(0,0,0,.08);
  }
  /* the black shoulder band every panda has */
  .body::before {
    content: "";
    position: absolute;
    top: 0; left: -10px; right: -10px;
    height: 34px;
    background: #222;
    border-radius: 0 0 50% 50%;
  }
  .belly-btn {
    position: absolute;
    top: 50px; left: 50%;
    transform: translateX(-50%);
    z-index: 6;
    white-space: nowrap;
    padding: 9px 16px;
    font: inherit;
    font-size: 15px;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(135deg, #ff8fab, #ff6b9a);
    border: none;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 6px 14px rgba(255,107,154,.45);
    animation: pulse 1.8s ease-in-out infinite;
  }
  .belly-btn:hover { filter: brightness(1.07); }
  .belly-btn:focus-visible { outline: 3px solid #ff6b9a; outline-offset: 3px; }
  @keyframes pulse {
    0%, 100% { transform: translateX(-50%) scale(1); }
    50% { transform: translateX(-50%) scale(1.08); }
  }

  .arm {
    position: absolute;
    top: 112px;
    width: 36px; height: 66px;
    background: #222;
    border-radius: 20px;
    z-index: 3;
  }
  .arm.l { left: 18px; transform: rotate(22deg); }
  .arm.r {
    right: 16px;
    transform-origin: top center;
    animation: wave 1.6s ease-in-out infinite;
    z-index: 5;
  }
  @keyframes wave {
    0%, 100% { transform: rotate(-150deg); }
    50% { transform: rotate(-118deg); }
  }

  /* bamboo in the left arm */
  .bamboo {
    position: absolute;
    top: 80px; left: -2px;
    width: 10px; height: 110px;
    background: repeating-linear-gradient(to bottom, #7cc46b 0 24px, #5aa84a 24px 27px);
    border-radius: 5px;
    transform: rotate(-12deg);
    z-index: 2;
  }
  .leaf {
    position: absolute;
    width: 26px; height: 10px;
    background: #6fc25c;
    border-radius: 0 100% 0 100%;
  }
  .leaf.a { top: 6px; left: 6px; transform: rotate(-25deg); }
  .leaf.b { top: 22px; right: 6px; transform: rotate(205deg); }

  .leg {
    position: absolute;
    bottom: 0;
    width: 46px; height: 40px;
    background: #222;
    border-radius: 50%;
    z-index: 4;
  }
  .leg::after {
    content: "";
    position: absolute;
    top: 10px; left: 13px;
    width: 20px; height: 17px;
    background: #ff9fb8;
    border-radius: 50%;
  }
  .leg.l { left: 36px; }
  .leg.r { right: 36px; }

  .hint {
    margin-top: 22px;
    font-size: 16px;
    color: #b0567a;
  }

  /* ---------- Card ---------- */
  .card {
    position: absolute;
    width: calc(100% - 32px);
    max-width: 420px;
    padding: 34px 26px 26px;
    background: #ffffff;
    border-radius: 24px;
    box-shadow: 0 20px 50px rgba(240,130,165,.28);
    border: 3px solid #ffd1dc;
    text-align: center;
    opacity: 0;
    transform: scale(.85) translateY(30px);
    pointer-events: none;
    transition: opacity .9s ease .4s, transform .9s cubic-bezier(.2,.9,.3,1.2) .4s;
    z-index: 10;
  }
  .card.show {
    opacity: 1;
    transform: scale(1) translateY(0);
    pointer-events: auto;
  }
  .card .mini { font-size: 40px; margin-bottom: 6px; }
  .card h1 {
    font-size: 27px;
    color: #d6487a;
    margin-bottom: 20px;
  }
  .card p {
    font-size: 18px;
    line-height: 1.9;
    color: #6b3a4b;
  }
  .card .sign {
    margin-top: 24px;
    padding-top: 14px;
    border-top: 1px dashed #ffb6c1;
    font-size: 16px;
    font-weight: 600;
    color: #b0567a;
  }

  /* ---------- Hearts rain ---------- */
  .heart {
    position: fixed;
    top: -40px;
    pointer-events: none;
    user-select: none;
    animation-name: fall;
    animation-timing-function: linear;
    animation-fill-mode: forwards;
    z-index: 5;
  }
  @keyframes fall {
    0% { transform: translateY(0) rotate(0deg); opacity: 0; }
    10% { opacity: 1; }
    100% { transform: translateY(110vh) rotate(var(--rot)); opacity: .9; }
  }

  @media (prefers-reduced-motion: reduce) {
    .bubble, .eye, .arm.r, .belly-btn, .head { animation: none; }
    .belly-btn { transform: translateX(-50%); }
    .head { transform: translateX(-50%); }
  }
</style>
</head>
<body>
  <main class="stage">
    <div class="bubble-wrap" id="bubbleWrap">
      <div class="bubble">
        <div class="panda">
          <div class="bamboo"><span class="leaf a"></span><span class="leaf b"></span></div>
          <div class="arm l"></div>
          <div class="arm r"></div>
          <div class="head">
            <div class="ear l"></div>
            <div class="ear r"></div>
            <div class="bow"><span></span></div>
            <div class="patch l"><div class="eye"></div></div>
            <div class="patch r"><div class="eye"></div></div>
            <div class="cheek l"></div>
            <div class="cheek r"></div>
            <div class="nose"></div>
            <div class="mouth"></div>
            <div class="tongue"></div>
          </div>
          <div class="body">
            <button class="belly-btn" id="openBtn" type="button">לחצי עליי ✨</button>
          </div>
          <div class="leg l"></div>
          <div class="leg r"></div>
        </div>
      </div>
      <div class="hint">יש לי משהו בשבילך 🐼</div>
    </div>

    <section class="card" id="card" aria-live="polite">
      <div class="mini">🐼</div>
      <h1>עבור דיאנה היקרה 🌸</h1>
      <p>
        לאישה המהממת שאת,<br>
        שיהיה יום מוצלח!<br>
        את אלופה, יפהפייה וחכמה — תזכרי את זה ותאמיני בזה מכל הלב.<br>
        תמשיכי בדיוק איך שאת ובמי שאת ✨
      </p>
      <div class="sign">— מריי ברוק</div>
    </section>
  </main>

<script>
  const btn = document.getElementById('openBtn');
  const wrap = document.getElementById('bubbleWrap');
  const card = document.getElementById('card');
  const hearts = ['💖', '💗', '💕', '🌸', '💓', '🩷'];
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function dropHeart() {
    const h = document.createElement('span');
    h.className = 'heart';
    h.textContent = hearts[Math.floor(Math.random() * hearts.length)];
    h.style.left = Math.random() * 100 + 'vw';
    h.style.fontSize = (16 + Math.random() * 22) + 'px';
    h.style.animationDuration = (4 + Math.random() * 4) + 's';
    h.style.setProperty('--rot', (Math.random() * 360 - 180) + 'deg');
    document.body.appendChild(h);
    h.addEventListener('animationend', () => h.remove());
  }

  btn.addEventListener('click', () => {
    btn.disabled = true;
    wrap.classList.add('hide');
    card.classList.add('show');
    if (!reduceMotion) setInterval(dropHeart, 250);
  });
</script>
</body>
</html>
