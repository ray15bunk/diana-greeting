<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>עבור דיאנה 🌸</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(160deg, #ffd1dc 0%, #ffe4ec 50%, #ffb6c1 100%);
    font-family: "Segoe UI", "Rubik", "Assistant", Arial, sans-serif;
    overflow: hidden;
    color: #6b3a4b;
  }

  .stage {
    position: relative;
    width: 100%;
    max-width: 480px;
    padding: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }

  /* ---------- Bubble + panda ---------- */
  .bubble-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: opacity .8s ease, transform .8s ease;
  }
  .bubble-wrap.hide {
    opacity: 0;
    transform: scale(.6) translateY(-40px);
    pointer-events: none;
  }

  .bubble {
    width: 280px;
    height: 280px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 25%, rgba(255,255,255,.95) 0 8%, rgba(255,255,255,.35) 22%, rgba(255,209,220,.35) 60%, rgba(255,182,193,.55) 100%);
    box-shadow: inset -10px -14px 30px rgba(255,140,170,.35), inset 8px 10px 25px rgba(255,255,255,.7), 0 18px 40px rgba(230,120,150,.3);
    border: 2px solid rgba(255,255,255,.7);
    position: relative;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    animation: float 4s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-14px); }
  }

  .panda {
    position: relative;
    width: 170px;
    height: 200px;
    margin-bottom: 18px;
  }

  .head {
    position: absolute;
    top: 0; left: 50%;
    width: 130px; height: 112px;
    transform: translateX(-50%);
    background: #fff;
    border-radius: 50% 50% 46% 46%;
    box-shadow: 0 4px 10px rgba(0,0,0,.08);
    z-index: 3;
  }
  .ear {
    position: absolute;
    top: -8px;
    width: 40px; height: 40px;
    background: #2b2b2b;
    border-radius: 50%;
    z-index: -1;
  }
  .ear.l { left: 2px; }
  .ear.r { right: 2px; }

  .patch {
    position: absolute;
    top: 38px;
    width: 34px; height: 42px;
    background: #2b2b2b;
    border-radius: 50%;
  }
  .patch.l { left: 24px; transform: rotate(25deg); }
  .patch.r { right: 24px; transform: rotate(-25deg); }

  .eye {
    position: absolute;
    top: 12px; left: 10px;
    width: 13px; height: 13px;
    background: #fff;
    border-radius: 50%;
    animation: blink 4.5s infinite;
  }
  .eye::after {
    content: "";
    position: absolute;
    top: 3px; left: 3px;
    width: 6px; height: 6px;
    background: #2b2b2b;
    border-radius: 50%;
  }
  @keyframes blink {
    0%, 92%, 100% { transform: scaleY(1); }
    95% { transform: scaleY(.1); }
  }

  .nose {
    position: absolute;
    top: 72px; left: 50%;
    width: 16px; height: 10px;
    transform: translateX(-50%);
    background: #2b2b2b;
    border-radius: 50% 50% 60% 60%;
  }
  .mouth {
    position: absolute;
    top: 82px; left: 50%;
    width: 22px; height: 10px;
    transform: translateX(-50%);
    border-bottom: 3px solid #2b2b2b;
    border-radius: 0 0 50% 50%;
  }
  .cheek {
    position: absolute;
    top: 76px;
    width: 18px; height: 10px;
    background: #ffb6c1;
    border-radius: 50%;
    opacity: .85;
  }
  .cheek.l { left: 14px; }
  .cheek.r { right: 14px; }

  .body {
    position: absolute;
    top: 90px; left: 50%;
    width: 120px; height: 105px;
    transform: translateX(-50%);
    background: #fff;
    border-radius: 50% 50% 45% 45%;
    z-index: 2;
    box-shadow: 0 4px 10px rgba(0,0,0,.08);
  }
  .belly-btn {
    position: absolute;
    top: 42px; left: 50%;
    transform: translateX(-50%);
    z-index: 5;
    white-space: nowrap;
    padding: 9px 16px;
    font: inherit;
    font-size: 15px;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(135deg, #ff8fab, #ff6b9a);
    border: none;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 6px 14px rgba(255,107,154,.45);
    animation: pulse 1.8s ease-in-out infinite;
  }
  .belly-btn:hover { filter: brightness(1.07); }
  .belly-btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  @keyframes pulse {
    0%, 100% { transform: translateX(-50%) scale(1); }
    50% { transform: translateX(-50%) scale(1.08); }
  }

  .arm {
    position: absolute;
    top: 100px;
    width: 34px; height: 64px;
    background: #2b2b2b;
    border-radius: 20px;
    z-index: 1;
  }
  .arm.l { left: 8px; transform: rotate(20deg); }
  .arm.r {
    right: 6px;
    transform-origin: top center;
    animation: wave 1.6s ease-in-out infinite;
  }
  @keyframes wave {
    0%, 100% { transform: rotate(-150deg); }
    50% { transform: rotate(-120deg); }
  }

  .leg {
    position: absolute;
    bottom: 0;
    width: 40px; height: 36px;
    background: #2b2b2b;
    border-radius: 50%;
    z-index: 3;
  }
  .leg.l { left: 30px; }
  .leg.r { right: 30px; }

  .hint {
    margin-top: 22px;
    font-size: 15px;
    opacity: .75;
  }

  /* ---------- Card ---------- */
  .card {
    position: absolute;
    width: calc(100% - 32px);
    max-width: 420px;
    padding: 34px 26px 26px;
    background: rgba(255,255,255,.88);
    backdrop-filter: blur(6px);
    border-radius: 24px;
    box-shadow: 0 20px 50px rgba(220,100,140,.3);
    border: 2px solid #ffd1dc;
    text-align: center;
    opacity: 0;
    transform: scale(.85) translateY(30px);
    pointer-events: none;
    transition: opacity .9s ease .4s, transform .9s cubic-bezier(.2,.9,.3,1.2) .4s;
    z-index: 10;
  }
  .card.show {
    opacity: 1;
    transform: scale(1) translateY(0);
    pointer-events: auto;
  }
  .card h1 {
    font-size: 27px;
    color: #d6487a;
    margin-bottom: 20px;
  }
  .card p {
    font-size: 18px;
    line-height: 1.9;
  }
  .card .sign {
    margin-top: 24px;
    padding-top: 14px;
    border-top: 1px dashed #ffb6c1;
    font-size: 15px;
    font-weight: 600;
    color: #b0567a;
  }

  /* ---------- Hearts rain ---------- */
  .heart {
    position: fixed;
    top: -40px;
    pointer-events: none;
    user-select: none;
    animation-name: fall;
    animation-timing-function: linear;
    animation-fill-mode: forwards;
    z-index: 5;
  }
  @keyframes fall {
    0% { transform: translateY(0) rotate(0deg); opacity: 0; }
    10% { opacity: 1; }
    100% { transform: translateY(110vh) rotate(var(--rot)); opacity: .9; }
  }

  @media (prefers-reduced-motion: reduce) {
    .bubble, .eye, .arm.r, .belly-btn { animation: none; }
    .belly-btn { transform: translateX(-50%); }
  }
</style>
</head>
<body>
  <main class="stage">
    <div class="bubble-wrap" id="bubbleWrap">
      <div class="bubble">
        <div class="panda" aria-hidden="false">
          <div class="arm l"></div>
          <div class="arm r"></div>
          <div class="head">
            <div class="ear l"></div>
            <div class="ear r"></div>
            <div class="patch l"><div class="eye"></div></div>
            <div class="patch r"><div class="eye"></div></div>
            <div class="cheek l"></div>
            <div class="cheek r"></div>
            <div class="nose"></div>
            <div class="mouth"></div>
          </div>
          <div class="body">
            <button class="belly-btn" id="openBtn" type="button">לחצי עליי ✨</button>
          </div>
          <div class="leg l"></div>
          <div class="leg r"></div>
        </div>
      </div>
      <div class="hint">יש לי משהו בשבילך 🐼</div>
    </div>

    <section class="card" id="card" aria-live="polite">
      <h1>עבור דיאנה היקרה 🌸</h1>
      <p>
        לאישה המהממת שאת,<br>
        שיהיה יום מוצלח!<br>
        את אלופה, יפהפייה וחכמה — תזכרי את זה ותאמיני בזה מכל הלב.<br>
        תמשיכי בדיוק איך שאת ובמי שאת ✨
      </p>
      <div class="sign">הודעת המשפט ("די תמשיך") — מרי ברוק</div>
    </section>
  </main>

<script>
  const btn = document.getElementById('openBtn');
  const wrap = document.getElementById('bubbleWrap');
  const card = document.getElementById('card');
  const hearts = ['💖', '💗', '💕', '🌸', '💓', '🩷'];
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function dropHeart() {
    const h = document.createElement('span');
    h.className = 'heart';
    h.textContent = hearts[Math.floor(Math.random() * hearts.length)];
    h.style.left = Math.random() * 100 + 'vw';
    h.style.fontSize = (16 + Math.random() * 22) + 'px';
    h.style.animationDuration = (4 + Math.random() * 4) + 's';
    h.style.setProperty('--rot', (Math.random() * 360 - 180) + 'deg');
    document.body.appendChild(h);
    h.addEventListener('animationend', () => h.remove());
  }

  btn.addEventListener('click', () => {
    btn.disabled = true;
    wrap.classList.add('hide');
    card.classList.add('show');
    if (!reduceMotion) setInterval(dropHeart, 250);
  });
</script>
</body>
</html>
